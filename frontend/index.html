<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/index.js"defer></script>
    <title>E-commerce</title>
</head>
<body>
    <header>
        <nav>
            <a href="./index.html">Home</a>
            <a href="./html/carrinho.html">Carrinho</a>
            <a href="./html/cadastro.html">Cadastrar</a>
            <a href="./html/login.html">Login</a>
        </nav>
    </header>
    <main id="grid-produtos">
        <div class="grid-produtos">
            <div class="card-produto">
                <div class="container-imagem">
                    <img src="${el.imagem}" alt="${el.nome}" class="imagem-produto">
                    
                    <span class="selo-desconto">-${(el.percentualDesconto)}%</span>
                </div>

                <div class="card-conteudo">
                    <h2 class="nome-produto">${el.nome}</h2>
                    
                    <p class="descricao-produto">
                        ${el.descricao}
                    </p>
                    
                    <div class="container-preco">
                        <span class="preco-original">R$ ${precoOriginal}</span>
                        <span class="preco-final">R$ ${precoFinal}</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
